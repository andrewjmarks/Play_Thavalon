<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thavalon</title>
</head>
<body>

<script>
    const path = window.location.pathname;
    const parts = path.split("/").filter(Boolean);
    const lastPart = parts[parts.length - 1];

    // If this looks like a file, let the browser handle it normally.
    if (lastPart.includes(".")) {
        window.location.href = "/Play_Thavalon/";
    } else {
        // Otherwise, treat it as a Thavalon game code.
        sessionStorage.setItem("thavalonGameCode", lastPart);

        fetch("/Play_Thavalon/game.html")
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(error => {
                console.error("Could not load game:", error);
            });
    }
</script>

</body>
</html>
