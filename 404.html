<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thavalon</title>
</head>
<body>

<script>
    const path = window.location.pathname;
    const parts = path.split("/").filter(Boolean);

    // Get the game code from the URL.
    const gameCode = parts[parts.length - 1];

    // Store the game code for game.html to use.
    sessionStorage.setItem("thavalonGameCode", gameCode);

    // Load game.html without changing the URL.
    fetch("/Play_Thavalon/game.html")
        .then(response => response.text())
        .then(html => {
            document.open();
            document.write(html);
            document.close();
        })
        .catch(error => {
            console.error("Could not load game:", error);
        });
</script>

</body>
</html>
