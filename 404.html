<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thavalon</title>
</head>
<body>
    <script>
        const path = window.location.pathname;

        // Get the part after /Play_Thavalon/
        const parts = path.split("/").filter(Boolean);
        const gameCode = parts[parts.length - 1];

        // If there is no game code, return to the main page.
        if (!gameCode || gameCode === "Play_Thavalon") {
            window.location.replace("/Play_Thavalon/");
        } else {
            // Open the game page while preserving the clean URL.
            window.location.replace(
                `/Play_Thavalon/game.html?code=${encodeURIComponent(gameCode)}`
            );
        }
    </script>
</body>
</html>
