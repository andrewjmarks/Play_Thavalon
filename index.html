<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Thavalon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

<div class="header">
    <img src="/Play_Thavalon/assets/sword.svg" alt="" class="header-sword">
    <h1>Thavalon</h1>
    <img src="/Play_Thavalon/assets/sword.svg" alt="" class="header-sword sword-right">
</div>

        <section class="player-section">

            <label for="playerInput">Enter player names</label>

            <div class="signiture-row">
                <div class="signature-input">
                    <input
                        type="text"
                        id="playerInput"
                        placeholder="Enter name"
                        autocomplete="off"
                    >
                <img src="./assets/line" alt="" class="signature-line">
            </div>

                <button id="addButton">Add</button>
            </div>

            <p id="playerCount">0 players</p>

            <div id="playerList"></div>

            <button id="startButton">Start Game</button>

            <div id="gameCreated" style="display: none;">
                <h2>Game Created!</h2>
                <p>Your game code is:</p>
                <strong id="gameCodeDisplay"></strong>
            </div>

        </section>
        <section class="open-games-section">
            <h2>Open Games</h2>
            <div id="openGames">
                <p>Loading games...</p>
            </div>
        </section>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js"></script>

</body>
</html>
